name: Tests

on:
  push:
    branches:
      - master
      - main
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.0'
            testbench: '^7.0'
          - php: '8.1'
            testbench: '^8.0'
          - php: '8.2'
            testbench: '^9.0'
          - php: '8.3'
            testbench: '^10.0'
          - php: '8.3'
            testbench: '^11.0'

    name: PHP ${{ matrix.php }} / Testbench ${{ matrix.testbench }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install dependencies
        run: |
          composer require --dev "orchestra/testbench:${{ matrix.testbench }}" --no-update
          composer update --prefer-dist --no-interaction

      - name: Execute tests
        run: vendor/bin/phpunit --colors=always
